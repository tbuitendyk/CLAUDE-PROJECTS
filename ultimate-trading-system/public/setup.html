<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setup</title>
<style>
  /* THEME TOKENS (NEXT-RELEASE points 24/25): shared with the Trading page —
     dark = the F1 technical baseline, light = the lab register. */
  :root, :root[data-theme="dark"] {
    --bg:#0e1116; --fg:#d6dce5; --muted:#6b7686; --dim:#8b96a5;
    --panel:#12161d; --tile:#171c24; --line:#232a35;
    --pos:#4ec9a5; --neg:#e06c75; --warn:#e5c07b; --accent:#9db4d0;
    --paper:#3b3320; --paperln:#e5c07b; --tabbg:#171c24; --tabon:#0e1116;
  }
  :root[data-theme="light"] {
    --bg:#f6f7f9; --fg:#1a2028; --muted:#8a94a2; --dim:#5a6472;
    --panel:#ffffff; --tile:#ffffff; --line:#dde2e8;
    --pos:#0a7d55; --neg:#c02a33; --warn:#8a6d00; --accent:#2c5fa8;
    --paper:#fff6da; --paperln:#8a6d00; --tabbg:#eceef1; --tabon:#ffffff;
  }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,system-ui,sans-serif; margin:0; padding:1.1rem;
         background:var(--bg); color:var(--fg); font-size:14px; }
  h1 { font-size:1.15rem; margin:0 0 .2rem; }
  h2 { font-size:.82rem; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); margin:1.1rem 0 .4rem; }
  h3 { font-size:.95rem; margin:.8rem 0 .3rem; }
  .sub { color:var(--dim); font-size:.8rem; margin-bottom:.9rem; }
  a { color:var(--accent); }
  /* A ROW OF TEXT AT DIFFERENT SIZES CARRIES align-items:baseline (owner,
     2026-09-18: "not bottom aligning text like this on setup | account and
     setup | compute looks sloppy"). .k is .66rem, .note is .74rem and a plain
     <b> is full size; centred, three sizes sit on three different lines and
     none of them line up. Baseline puts them on one. The same reason the
     heading strip below already does it.
     A row holding a FORM CONTROL is a different case and keeps centre, except
     a tick beside a field, which bottom-aligns (RULE FOUR-A). */
  .row { display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; }
  .spacer { flex:1; }
  .muted { color:var(--muted); } .pos{color:var(--pos);} .neg{color:var(--neg);} .warn{color:var(--warn);}
  .tabs { display:flex; gap:.25rem; border-bottom:1px solid var(--line); margin:.4rem 0 .9rem; flex-wrap:wrap; }
  .tab { background:var(--tabbg); border:1px solid var(--line); border-bottom:none;
         border-radius:7px 7px 0 0; padding:.4rem .8rem; cursor:pointer; color:var(--dim); font-size:.82rem; }
  .tab.on { background:var(--tabon); color:var(--fg); font-weight:600; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:.8rem .9rem; margin-bottom:1rem; }
  table { width:100%; border-collapse:collapse; font-size:.8rem; }
  th,td { text-align:right; padding:.32rem .45rem; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th:first-child,td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:600; font-size:.66rem; text-transform:uppercase; }
  tr.clickable { cursor:pointer; } tr.clickable:hover td { background:var(--tile); }
  tr.selected td { background:var(--tile); box-shadow: inset 3px 0 0 var(--accent); }
  .tile { background:var(--tile); border:1px solid var(--line); border-radius:8px; padding:.55rem .7rem; }
  .k { color:var(--dim); font-size:.66rem; text-transform:uppercase; letter-spacing:.04em; }
  .v { font-size:1.05rem; margin-top:.15rem; font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.55rem; }
  .badge { display:inline-block; font-size:.62rem; font-weight:700; text-transform:uppercase;
           padding:.1rem .4rem; border-radius:4px; letter-spacing:.04em; vertical-align:middle; }
  .b-pass { background:transparent; color:var(--pos); border:1px solid var(--pos); cursor:pointer; }
  .b-warn { background:transparent; color:var(--warn); border:1px solid var(--warn); cursor:pointer; }
  .b-fail { background:transparent; color:var(--neg); border:1px solid var(--neg); cursor:pointer; }
  button { font:inherit; border:1px solid var(--line); background:var(--tile); color:var(--fg);
           border-radius:6px; padding:.35rem .8rem; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }   /* a dead button does not answer the mouse (3.227.0) */
  button.pri { background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600; }
  button.danger { border-color:var(--neg); color:var(--neg); }
  button:disabled { opacity:.45; cursor:default; }
  .themebtn { font-size:.72rem; padding:.25rem .6rem; }
  input, select, textarea { font:inherit; background:var(--tile); color:var(--fg);
    border:1px solid var(--line); border-radius:5px; padding:.28rem .45rem; }
  label.f { display:flex; flex-direction:column; gap:.15rem; font-size:.74rem; color:var(--dim); }
  label.c { display:flex; align-items:center; gap:.35rem; font-size:.8rem; color:var(--fg); }
  /* a control this run will not use: greyed, never hidden, so the row keeps its
     shape and neighbouring labels keep their context (owner, 2026-07-31) */
  .ctl-off { opacity:.5; }
  .empty { color:var(--muted); padding:1rem .9rem; }
  code { color:var(--accent); font-size:.82rem; }
  pre { white-space:pre-wrap; font-size:.72rem; background:var(--tile); border:1px solid var(--line);
        border-radius:6px; padding:.5rem; }
  details > summary { cursor:pointer; color:var(--dim); font-size:.76rem; }
  .scrollx { overflow-x:auto; }
  .note { color:var(--muted); font-size:.74rem; }
  /* TOP-LEVEL NAVIGATION (THIS-RELEASE point 17). The three tabs of the system,
     carried on every page. Lives inside the existing site band, which is
     already display:flex + align-items:center, so it lines up by construction
     rather than by nudging (CLAUDE.md RULE FOUR). Deliberately NOT the .tab
     class: that one names the sections inside a page, and two identical rows
     of tabs would say the wrong thing about the hierarchy. */
  .toptabs { display:flex; gap:.3rem; margin-left:.5rem; }
  .toptab { text-decoration:none; color:var(--dim); background:var(--tabbg);
            border:1px solid var(--line); border-radius:6px; padding:.25rem .75rem;
            font-size:.82rem; line-height:1.35; }
  .toptab:hover { border-color:var(--accent); }
  .toptab.on { background:var(--tabon); color:var(--fg); font-weight:600; border-color:var(--accent); }
  /* THE TOP OF THE PAGE STAYS PUT (owner, 2026-08-21). The tabs used to scroll
     away with everything else, so getting back to another one meant scrolling
     to the top first — on the Help tab, which is long, that is a long way.
     Everything above the content is frozen: the site line, the page title, the
     line saying what the page is for, and the tabs themselves.

     The negative margin and matching padding are not decoration. The page has
     padding around it, and a sticky block would otherwise let the scrolling
     content show through that padding at the sides and above. This makes the
     frozen block span the full width and carry the page background with it. */
  .pagetop { position:sticky; top:0; z-index:20; background:var(--bg);
    margin:-1.1rem -1.1rem 0; padding:1.1rem 1.1rem 0; }
  /* NO SECTION-LEVEL THEME. One built here for a day (2026-08-25) and the
     owner removed it the same day: "YOU'VE ALREADY GOT THEME BUTTONS ON
     Construct AND Trade THAT WORK THE WAY WE WANT". The theme button in this
     page's own header is the one mechanism, same key, same behaviour. */
  .loadbar { height:8px; background:var(--line); border-radius:4px; overflow:hidden; margin-top:.3rem; }
  .loadbar > div { height:100%; background:var(--accent); }
</style>
</head>
<body>
  <div class="pagetop">
    <div class="row" style="border-bottom:1px solid var(--line); padding-bottom:.55rem; margin-bottom:.8rem; font-size:.85rem">
      <a href="https://www.buitendyk.ca/" style="text-decoration:none; font-weight:700; color:var(--fg)">buitendyk<span style="color:var(--accent)">.ca</span></a>
      <span class="muted">/ ultimate trading system</span>
      <nav class="toptabs">
      <a class="toptab on" href="setup.html">Setup</a>
      <a class="toptab" href="construct.html">Construct</a>
      <a class="toptab" href="trade.html">Trade</a>
      </nav>
      <div class="spacer"></div>
  </div>

  <!-- Baseline, not centre: two type sizes on one line align on the text
       baseline, or the title hangs below the small text (owner order,
       2026-08-26, caught on Construct — same pattern on all three pages). -->
  <div class="row" style="align-items:baseline">
    <h1 style="margin:0">Setup</h1>
    <span id="utcClock" class="muted" style="font-variant-numeric:tabular-nums">&mdash;</span>
    <div class="spacer"></div>
    <button class="themebtn" id="themebtn">&#9686; Theme</button>
  </div>
  <div class="sub">Account and system settings, and the release&#39;s own check.</div>
  <div class="tabs">
    <div class="tab" data-tab="account">Account</div>
    <div class="tab" data-tab="compute">Compute</div>
    <div class="tab" data-tab="version">Version</div>
  </div>
  </div>

  <div id="view"></div>

<script>
// Self-contained on purpose: this page must still work when it is served by
// the small always-up program at its fallback address, with the main service
// down — so it pulls in nothing.
const $ = (s, r) => (r || document).querySelector(s);
const esc = (t) => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
// WHERE THIS PAGE IS, AND WHERE IT ASKS (3.135.0, owner order 2026-09-14: "we
// need to always be able to reload the cpu page to restart the engine even if
// it's not running"; 3.136.0: "it should not be possible to kill the engine
// such that we can't turn it back on"). This page is served at two addresses:
// its usual one, …/setup.html, and the always-up program's own, …/svc/setup.html.
// The website's routing serves the USUAL address from the always-up program
// too, never from the trading service this page starts and stops -- so a
// reload of it comes back with that service running or not, and so does the
// front door of the system, which is this page. What is left for the page to
// do is tell the two addresses apart from wherever it was loaded, so that one
// file asks each program at its own absolute address from either.
const HERE = location.pathname.replace(/[^/]*$/, '');
const AT_SVC = /\/svc\/$/.test(HERE);
const ENGINE_DIR = AT_SVC ? HERE.replace(/svc\/$/, '') : HERE;     // the trading service: its pages and its api/…
const CONTROL_DIR = AT_SVC ? HERE : HERE + 'svc/';                 // the always-up program: svc/api/…
const at = (p) => (p.startsWith('svc/') ? CONTROL_DIR + p.slice(4) : ENGINE_DIR + p);
// The three pages are the trading service's; only this one has a second home.
document.querySelectorAll('nav.toptabs a').forEach((a) => {
  const page = a.getAttribute('href');
  a.setAttribute('href', page === 'setup.html' ? CONTROL_DIR + page : ENGINE_DIR + page);
});
const root = document.documentElement;
// Same key the Construct page uses, so the choice carries between them.
root.setAttribute('data-theme', localStorage.getItem('cx-theme') || 'dark');
$('#themebtn').onclick = () => {
  const n = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', n); localStorage.setItem('cx-theme', n);
};
const clock = $('#utcClock');
const tick = () => { clock.textContent = new Date().toISOString().slice(0, 19).replace('T', ' ') + ' UTC'; };
tick(); setInterval(tick, 1000);

// A failed ask and an empty answer are different answers, and every panel
// below says which it got. Nothing on this page pretends.
const getJson = async (p) => {
  const r = await fetch(at(p));
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
};
const postJson = async (p, body) => {
  const r = await fetch(at(p), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
  return j;
};

let tab = localStorage.getItem('setup-tab') || 'account';
let cTimer = null;           // the thirty-second re-read, armed only while Compute shows
let cLoads = null;           // last reading from the small always-up program
let cCfg = null;             // last reading from the trading service
let cErrLoads = null;
let cErrCfg = null;
let cEng = null;             // the trading engine records, with whether each answers (loop of 2026-09-25)
let cErrEng = null;
let cEngEdit = null;         // the engine record being changed in the form, or null when the form is closed
let cEngTyped = {};          // what is typed in the form, kept across the thirty-second redraw
let cSvcMsg = {};            // what the last press of each button on this tab answered, beside it, kept across the redraw
let cEs = null;              // the engine setups: the template and one checklist per engine (owner, 2026-09-25)
let cErrEs = null;
let cEsTyped = '';           // the descriptive name typed for another engine, kept across the redraw
let cEsTypedShort = '';      // its short name, likewise
let cEsTypedFix = '';        // the short name typed for a checklist started without one
let cEsNew = false;          // the boxes for another engine's setup shown or not
let cEsCode = null;          // an install command's code, shown once to the page that asked: { setupId, code, expiresUtc }
let cEsOpen = false;         // the setup area open or closed: this viewer's own, remembered in the browser
let cEsSel = null;           // which engine's checklist is shown
try { cEsOpen = localStorage.getItem('setup-es-open') === '1'; cEsSel = localStorage.getItem('setup-es-sel') || null; } catch (_) { /* a private window: closed, newest */ }
let aAcc = null;             // the account's exchange records, and which fee is the system default
let aErr = null;             // why they could not be read, when they could not
let aTr = null;              // the trading accounts, the engines, and what each engine says of their keys (loop of 2026-09-25)
let aTrErr = null;
let aTrKeys = null;          // the trading account whose key form is open, or null
let aTrTyped = {};           // the new-account form as typed, kept across a redraw (never the keys)
// SETTING UP A TRADING ACCOUNT, STEP BY STEP (3.268.0): the checklist area, shaped as a platform's
let aAsOpen = (() => { try { return localStorage.getItem('setup-as-open') === '1'; } catch (_) { return false; } })();
let aAsSel = (() => { try { return localStorage.getItem('setup-as-sel'); } catch (_) { return null; } })();
let aAsNew = false;          // the boxes for another account's setup shown or not
let aAsTyped = { id: '', exchange: '' };   // what is typed for another account, kept across the redraw
let vTimer = null;           // the five-second re-read, armed only while Version shows
let vSg = null;              // last reading of the stage-engine check
let vErr = null;             // why the check could not be read, when it could not

const mb = (b) => b == null ? '—' : b >= 1073741824 ? (b / 1073741824).toFixed(2) + ' GB' : Math.round(b / 1048576) + ' MB';
const age = (s) => s == null ? '—' : s < 90 ? s + 's' : s < 5400 ? Math.round(s / 60) + 'm' : s < 172800 ? (s / 3600).toFixed(1) + 'h' : (s / 86400).toFixed(1) + 'd';

// ---- Account (owner order, 2026-09-18) -------------------------------------
// WHAT THIS ACCOUNT PAYS TO TRADE. The owner's words: the Account tab is "the
// source of the FEE_PER_LEG constant that's NOT in code but given by the user",
// and "the exchange record under Account needs to indicate at least a basic
// Binance trading profile, and under that the Binance FEE_PER_LEG with the
// option to use as the system default".
//
// The list of exchanges comes from the trading service, never from here, so
// the day a second one is supported it appears on this screen with nobody
// editing this file (RULE FIVE).
// THE LOCK FOR KEYS (owner, 2026-09-25): the browser's own WebCrypto, from the
// trading service (keylock.js), loaded the first time it is needed
let keyLockLoading = null;
function keyLock() {
  if (!keyLockLoading) {
    keyLockLoading = new Promise((resolve, reject) => {
      const el = document.createElement('script');
      el.src = ENGINE_DIR + 'keylock.js?v=1';
      el.onload = () => (window.utsKeyLock ? resolve(window.utsKeyLock) : reject(new Error('the lock for keys did not load')));
      el.onerror = () => { keyLockLoading = null; reject(new Error('the lock for keys could not be loaded from the trading service')); };
      document.head.appendChild(el);
    });
  }
  return keyLockLoading;
}
async function loadAccount() {
  const a = getJson('api/account').then((d) => { aAcc = d; aErr = null; }, (e) => { aAcc = null; aErr = e.message; });
  const b = getJson('api/account/trading').then((d) => { aTr = d; aTrErr = null; }, (e) => { aTr = null; aTrErr = e.message; });
  await Promise.all([a, b]);
  // THE FINGERPRINT IS WORKED OUT HERE, in this browser, from the very public
  // half the keys will be locked with -- never taken from the service's word --
  // so what the installer printed on the machine can be compared with it by eye
  if (aTr && aTr.keys) {
    try {
      const kl = await keyLock();
      await Promise.all(Object.values(aTr.keys).map(async (k) => { if (k && k.lock && k.lock.publicKey) k.lockHere = await kl.fingerprint(k.lock.publicKey); }));
    } catch (_) { /* the form says the lock could not be loaded, and sends nothing */ }
  }
}

// ---- THE TRADING ACCOUNTS (loop of 2026-09-25) --------------------------------
// One record for each trading account a setup trades through, named the way a
// setup names its account. Its keys are typed here once and go straight to the
// trading engine, which keeps them encrypted on the trading box: this machine
// never keeps them, and nothing anywhere shows them again -- only whether they
// are there, and when they were entered (item 7 of the read-back).
function tradingKeysLine(a) {
  const engines = aTr.engines || [];
  if (!engines.length) return '<div class="row" style="align-items:baseline; margin-top:.35rem"><span class="note">no trading platform on record yet — one is added on the <b>Compute</b> tab</span></div>';
  return engines.map((g) => {
    const k = (aTr.keys || {})[g.id] || { answers: false, why: 'not asked' };
    const mine = k.answers ? (k.keys || []).find((x) => x.account === a.id) : null;
    const said = !k.answers
      ? '<span class="neg">cannot tell</span> <span class="muted">(' + esc(k.why) + ')</span>'
      : mine && mine.present
        ? '<span class="pos">present</span> <span class="muted">entered ' + esc(String(mine.addedAt || '').slice(0, 16).replace('T', ' ')) + ' UTC'
          + (mine.tied === true ? ' · tied to one address' : mine.tied === false ? ' · open to any address, as ticked when they were sent' : '') + '</span>'
        : '<span class="neg">missing</span>';
    return '<div class="row" style="align-items:baseline; margin-top:.35rem"><span class="k">keys on ' + esc(g.name) + '</span> ' + said + '</div>';
  }).join('');
}
function tradingAccountCard(a) {
  const ex = (aTr.offered || []).find((x) => x.id === a.exchange);
  const engines = aTr.engines || [];
  const open = aTrKeys === a.id;
  const pick = engines.find((g) => g.isDefault) || engines[0] || null;
  const keysHere = pick && (aTr.keys || {})[pick.id] && (aTr.keys[pick.id].keys || []).find((x) => x.account === a.id && x.present);
  return '<div class="tile" style="margin-bottom:.55rem">'
    + '<div class="row" style="align-items:baseline"><b>' + esc(a.id) + '</b><span class="note">' + esc(ex ? ex.label : a.exchange) + (a.note ? ' · ' + esc(a.note) : '') + '</span></div>'
    + tradingKeysLine(a)
    + (open
      ? '<div class="row" style="align-items:flex-end; margin-top:.5rem">'
        + '<label class="f" title="the public half of the key, as the exchange shows it when the key is made">API key<input id="takKey" type="password" autocomplete="off" spellcheck="false" style="width:24rem"></label>'
        + '<label class="f" title="the secret half, shown by the exchange once, when the key is made">secret key<input id="takSec" type="password" autocomplete="off" spellcheck="false" style="width:24rem"></label>'
        + (engines.length > 1 ? '<label class="f" title="the trading platform that keeps these keys">trading platform<select id="takEng">'
          + engines.map((g) => '<option value="' + esc(g.id) + '"' + (pick && g.id === pick.id ? ' selected' : '') + '>' + esc(g.name) + '</option>').join('') + '</select></label>' : '')
        + '<label class="c"><input type="checkbox" id="takAny"> these keys may trade from any address</label>'
        + '</div>'
        + '<p class="note" style="margin-top:.4rem">Make the key on the exchange trade-only, with withdrawals off. Tying it to the address of the platform&#39;s machine is safer; '
        + 'if you leave it open to any address, tick the box, and what such a key may do is your exchange&#39;s rule. '
        + 'The keys are locked in this browser with the platform&#39;s lock before they leave it, so this system passes them on without being able to read them.</p>'
        + '<div class="row" style="align-items:baseline; margin-top:.2rem"><span class="k">the fingerprint of the platform&#39;s lock</span> <span id="takLockFp" class="note"></span></div>'
        + '<div class="row" style="margin-top:.4rem"><button id="takSend" class="pri">Send the keys to the trading platform</button><button id="takCancel">Do not send</button><span id="takMsg" class="note"></span></div>'
      : '<div class="row" style="margin-top:.5rem">'
        + (engines.length ? '<button data-takeys="' + esc(a.id) + '">' + (keysHere ? 'Replace the keys' : 'Enter the keys') + '</button>' : '')
        + (keysHere ? '<button data-tarm="' + esc(a.id) + '" class="danger" title="takes the keys off the trading platform; the account record stays">Remove the keys</button>' : '')
        + '<button data-tadel="' + esc(a.id) + '" class="danger" title="takes the record away; refused while any setup names it as its account">Delete the trading account</button>'
        + '<span id="taOut_' + esc(a.id) + '" class="note"></span></div>')
    + '</div>';
}
function tradingAccountsHtml() {
  if (!aTr) return '<div class="panel"><h3 style="margin-top:0">Trading accounts</h3><p class="note neg">the trading service did not answer, so the trading accounts cannot be shown' + (aTrErr ? ' — ' + esc(aTrErr) : '') + '</p></div>';
  const v = (k) => esc(aTrTyped[k] || '');
  return '<div class="panel"><h3 style="margin-top:0">Trading accounts</h3>'
    + '<p class="note">One record for each trading account a setup trades through, named the way the setup names its account. '
    + 'Its keys are locked in this browser with the trading platform&#39;s lock before they are sent, so this system passes them on without being able to read them, '
    + 'and the platform keeps them encrypted on its machine. Nothing shows them again — only whether they are there.</p>'
    + asHtml()
    + ((aTr.accounts || []).length ? aTr.accounts.map(tradingAccountCard).join('') : '<p class="note">no trading account yet</p>')
    + '<div class="tile"><div class="k" style="margin-bottom:.35rem">A new trading account</div>'
    + '<div class="row" style="align-items:flex-end">'
    + '<label class="f" title="the name a setup gives its account: letters, digits, dot, dash and underscore">account name<input id="taId" value="' + v('id') + '" style="width:12rem"></label>'
    + '<label class="f" title="the exchange the account is on">exchange<select id="taEx">' + (aTr.offered || []).map((x) => '<option value="' + esc(x.id) + '">' + esc(x.label) + '</option>').join('') + '</select></label>'
    + '<label class="f" title="anything you want to see beside the name">note<input id="taNote" value="' + v('note') + '" style="width:20rem"></label>'
    + '</div>'
    + '<div class="row" style="margin-top:.5rem"><button id="taSave" class="pri">Save the trading account</button><span id="taMsg" class="note"></span></div>'
    + '</div></div>';
}
// ---- SETTING UP A TRADING ACCOUNT, STEP BY STEP (3.268.0, owner 2026-09-26) ----
// "we're going to follow the same build while setting-up pattern with a new
// account set-up on Binance". One checklist per trading account, kept on its
// record (lib/accountsetup.js), opened and closed by the button in this
// section and drawn by the same code as a platform's checklist on the Compute
// tab (checklistStepsHtml), so the two cannot come to look different.
const asList = () => ((aTr && aTr.accounts) || []).filter((a) => a.setup);
function currentAs() { const l = asList(); return l.find((x) => x.id === aAsSel) || l[l.length - 1] || null; }
function asProgress(a) {
  const n = ((a.setup && a.setup.steps) || []).findIndex((st) => !st.done);
  return n < 0 ? 'every step done' : 'step ' + (n + 1) + ' of ' + a.setup.steps.length;
}
function asNewHtml() {
  return '<div class="row" style="margin-top:.5rem">'
    + '<label class="c"><span class="muted">account name — letters, digits, dot, dash and underscore</span><input id="asId" value="' + esc(aAsTyped.id) + '" placeholder="binance-sub-1" style="width:12rem"></label>'
    + '<label class="c"><span class="muted">exchange</span><select id="asEx">' + (aTr.offered || []).map((x) => '<option value="' + esc(x.id) + '"' + (aAsTyped.exchange === x.id ? ' selected' : '') + '>' + esc(x.label) + '</option>').join('') + '</select></label></div>'
    + '<div class="row" style="margin-top:.5rem"><button id="asStart">Start its setup</button><span id="asMsg" class="note"></span></div>';
}
function asHtml() {
  let body = '';
  if (aAsOpen) {
    const l = asList();
    const sel = currentAs();

      body = '<p class="note" style="margin:0">no trading account is being set up yet: give it its name and its exchange, and start its setup. A name already on a record below starts the setup for that account.</p>' + asNewHtml();
    } else {
      const ex = ((aTr.offered || []).find((x) => x.id === sel.exchange) || {}).label || sel.exchange;
      body = (l.length > 1

          + l.map((x) => '<option value="' + esc(x.id) + '"' + (x.id === sel.id ? ' selected' : '') + '>' + esc(x.id) + ' — ' + asProgress(x) + '</option>').join('') + '</select></label></div>'
        : '')
        + '<div class="row" style="align-items:baseline"><b style="font-size:.95rem">' + esc(sel.id) + '</b><span class="note">' + esc(ex) + '</span><span class="note">' + asProgress(sel) + '</span></div>'
        + checklistStepsHtml('as', sel.setup, aTr.setupTemplate, null)

        + '<div class="row" style="margin-top:1rem;border-top:1px solid var(--line);padding-top:.7rem"><button id="asNewToggle" aria-expanded="' + aAsNew + '">' + (aAsNew ? '▾' : '▸') + ' Set up another account</button></div>'
        + (aAsNew ? asNewHtml() : '');
    }
  }
  return '<div class="row" style="margin-top:.4rem"><button id="asToggle" aria-expanded="' + aAsOpen + '" title="opens and closes the checklist that takes a trading account from nothing to trading, one step at a time">' + (aAsOpen ? '▾' : '▸') + ' Set up a trading account</button></div>'
    + (aAsOpen ? '<div class="tile" style="margin:.5rem 0 .8rem">' + body + '</div>' : '');
}
function wireAs(redraw) {
  const tg = $('#asToggle');
  if (tg) tg.onclick = () => { aAsOpen = !aAsOpen; try { localStorage.setItem('setup-as-open', aAsOpen ? '1' : '0'); } catch (_) { /* not remembered */ } drawAccount(); };
  const nm = $('#asId');
  if (nm) nm.oninput = () => { aAsTyped.id = nm.value; };
  const ex = $('#asEx');
  if (ex) ex.onchange = () => { aAsTyped.exchange = ex.value; };
  const nt = $('#asNewToggle');
  if (nt) nt.onclick = () => { aAsNew = !aAsNew; drawAccount(); };
  const sl = $('#asSel');
  if (sl) sl.onchange = () => { aAsSel = sl.value; try { localStorage.setItem('setup-as-sel', aAsSel); } catch (_) { /* not remembered */ } drawAccount(); };
  const st = $('#asStart');
  if (st) st.onclick = async () => {
    const msg = $('#asMsg');
    st.disabled = true;
    msg.innerHTML = 'starting…';
    try {
      const got = await postJson('api/account/setups', { id: $('#asId').value.trim(), exchange: $('#asEx').value });
      aAsSel = got.setup.id;
      aAsTyped = { id: '', exchange: '' };
      aAsNew = false;
      try { localStorage.setItem('setup-as-sel', aAsSel); } catch (_) { /* not remembered */ }
      await redraw();
    } catch (e) { msg.innerHTML = '<span class="neg">not started — ' + esc(e.message) + '</span>'; st.disabled = false; }
  };
  const post = async (what, body) => {
    const sel = currentAs();
    if (!sel) return;
    try { await postJson('api/account/setups/' + encodeURIComponent(sel.id) + '/' + what, body); }
    catch (e) { alert('Not saved — ' + e.message); }
    await redraw();
  };
  document.querySelectorAll('[data-as-choice]').forEach((r) => { r.onchange = () => { const [step, choice] = r.dataset.asChoice.split('|'); post('choice', { step, choice, value: r.value }); }; });
  document.querySelectorAll('[data-as-tick]').forEach((c) => { c.onchange = () => { const [step, tick] = c.dataset.asTick.split('|'); post('tick', { step, tick, on: c.checked }); }; });
  const del = $('#asDelete');
  if (del) del.onclick = async () => {
    const sel = currentAs();
    if (!sel || !confirm('Delete the setup for "' + sel.id + '"?\n\nThe checklist is taken away. The trading account record and its keys stay.')) return;
    try { await postJson('api/account/setups/' + encodeURIComponent(sel.id) + '/delete', {}); aAsSel = null; }
    catch (e) { alert('Not deleted — ' + e.message); }
    await redraw();
  };
}
function wireTradingAccounts() {
  if (!aTr) return;
  for (const [sel, key] of [['#taId', 'id'], ['#taNote', 'note']]) { const el = $(sel); if (el) el.oninput = () => { aTrTyped[key] = el.value; }; }
  const redraw = async () => { await loadAccount(); drawAccount(); };
  wireAs(redraw);
  const sv = $('#taSave');
  if (sv) sv.onclick = async () => {
    const msg = $('#taMsg');
    sv.disabled = true; msg.innerHTML = 'saving…';
    try {
      await postJson('api/account/trading', { id: $('#taId').value.trim(), exchange: $('#taEx').value, note: $('#taNote').value });
      aTrTyped = {};
      await redraw();
      const m2 = $('#taMsg'); if (m2) m2.innerHTML = '<span class="pos">saved</span>';
    } catch (e) { msg.innerHTML = '<span class="neg">not saved — ' + esc(e.message) + '</span>'; sv.disabled = false; }
  };
  document.querySelectorAll('[data-takeys]').forEach((b) => { b.onclick = () => { aTrKeys = b.dataset.takeys; drawAccount(); const k = $('#takKey'); if (k) k.focus(); }; });
  document.querySelectorAll('[data-tadel]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Delete the trading account "' + b.dataset.tadel + '"?\n\nRefused while any setup names it as its account. Its keys on the trading platform are not touched — remove them first if they should go too.')) return;
      try { await postJson('api/account/trading/' + encodeURIComponent(b.dataset.tadel) + '/delete', {}); await redraw(); }
      catch (e) { const o = $('#taOut_' + b.dataset.tadel); if (o) o.innerHTML = '<span class="neg">not deleted — ' + esc(e.message) + '</span>'; }
    };
  });
  const enginePick = () => { const sel = $('#takEng'); if (sel) return sel.value; const g = (aTr.engines || []).find((x) => x.isDefault) || (aTr.engines || [])[0]; return g ? g.id : ''; };
  document.querySelectorAll('[data-tarm]').forEach((b) => {
    b.onclick = async () => {
      if (!confirm('Take the keys of "' + b.dataset.tarm + '" off the trading platform?\n\nA setup that trades through this account cannot place a real order until keys are entered again.')) return;
      try { await postJson('api/account/trading/' + encodeURIComponent(b.dataset.tarm) + '/keys', { engine: enginePick(), remove: true }); await redraw(); }
      catch (e) { const o = $('#taOut_' + b.dataset.tarm); if (o) o.innerHTML = '<span class="neg">not removed — ' + esc(e.message) + '</span>'; }
    };
  });
  const cancel = $('#takCancel');
  if (cancel) cancel.onclick = () => { aTrKeys = null; drawAccount(); };
  // the lock of the engine picked, and its fingerprint as worked out in this browser
  const lockOf = () => { const k = (aTr.keys || {})[enginePick()]; return k && k.lock && k.lockHere ? k : null; };
  const showLock = () => {
    const fp = $('#takLockFp');
    if (!fp) return;
    const k = lockOf();
    fp.innerHTML = k ? '<b>' + esc(k.lockHere) + '</b> — the install command printed the same on the platform&#39;s machine'
      : '<span class="neg">this platform has not said what its lock is, so no keys can be locked for it — it needs this system&#39;s release, installed with a new install command</span>';
  };
  showLock();
  const pickEl = $('#takEng');
  if (pickEl) pickEl.onchange = showLock;
  const send = $('#takSend');
  if (send) send.onclick = async () => {
    const msg = $('#takMsg');
    const key = $('#takKey'); const sec = $('#takSec');
    const k = lockOf();
    if (!k) { msg.innerHTML = '<span class="neg">not sent — this platform has no lock for keys</span>'; return; }
    send.disabled = true; msg.innerHTML = 'locking and sending…';
    try {
      const acct = aTrKeys;
      // LOCKED HERE, BEFORE ANYTHING LEAVES THIS PAGE: only the locked form is sent
      const locked = await (await keyLock()).lockKeys(k.lock.publicKey, acct, key.value.trim(), sec.value.trim());
      const got = await postJson('api/account/trading/' + encodeURIComponent(acct) + '/keys', { engine: enginePick(), locked, anyAddress: $('#takAny').checked });
      // THE BOXES ARE EMPTIED THE MOMENT THE KEYS ARE SENT, taken or not
      key.value = ''; sec.value = '';
      aTrKeys = null;
      await redraw();
      const o = $('#taOut_' + acct);
      if (o) o.innerHTML = got.checked
        ? '<span class="pos">kept — the exchange says the key can trade and borrow, cannot move money, and ' + (got.tied ? 'is tied to one address' : 'is open to any address, as you ticked') + '</span>'
        : '<span class="warn">kept, but not checked — ' + esc(got.why || 'the platform could not ask the exchange') + '</span>';
    } catch (e) {
      key.value = ''; sec.value = '';
      msg.innerHTML = '<span class="neg">not stored — ' + esc(e.message) + '</span>';
      send.disabled = false;
    }
  };
}

const pc3 = (v) => (v == null ? '—' : Number(v).toFixed(3) + '%');

    return '<div class="panel" style="margin-bottom:.7rem">'

      + (e.isDefault ? ' checked' : '') + '> use as the system default</label>'

  $('#view').innerHTML = (aErr
    ? '<div class="panel"><p class="note neg">the trading service did not answer, so the account cannot be shown — ' + esc(aErr) + '</p></div>'

    + inForce
    + (aAcc ? '<div class="panel" style="padding-bottom:.2rem"><h3 style="margin-top:0">Where this account trades</h3>'
      + '<p class="note">One exchange record for each venue this account trades on (for example Binance). '

    + tradingAccountsHtml()
    + '<div class="panel"><div class="empty">The rest of the settings that belong to the whole account '

  for (const e of aAcc.exchanges) {
    const b = $('#acSave_' + e.id);

          id: e.id,
          feePct: $('#acFee_' + e.id).value,

// ---- Compute (owner design, 2026-08-25) ------------------------------------
// Where each part of the system runs, what each service is doing right now,
// and the controls over how much of the machine each may take. The loads come
// from a separate small program that stays up when the trading service does
// not, so this tab keeps reporting exactly when the report matters.
async function loadCompute() {
  const a = getJson('svc/api/compute').then((d) => { cLoads = d; cErrLoads = null; }, (e) => { cErrLoads = e.message; });
  const b = getJson('api/compute-config').then((d) => { cCfg = d; cErrCfg = null; }, (e) => { cErrCfg = e.message; });
  const c = getJson('api/live/engines').then((d) => { cEng = d; cErrEng = null; }, (e) => { cErrEng = e.message; });
  const d = getJson('api/live/engine-setups').then((x) => { cEs = x; cErrEs = null; }, (e) => { cErrEs = e.message; });
  await Promise.all([a, b, c, d]);
}

  const ans = !u.answers ? ''
    : u.answers.answering
      ? ' · <span class="pos">answered in ' + u.answers.ms + ' ms</span>'
      : ' · <span class="neg">did not answer</span> <span class="muted">(' + esc(u.answers.why) + ')</span>';
  const quota = u.quotaPct == null ? null : u.quotaPct;
  const barPct = u.cpuPct == null ? 0 : Math.min(100, quota ? (u.cpuPct / quota) * 100 : u.cpuPct);
  const short = u.unit.replace(/\.service$/, '');
  return '<div class="tile" style="margin-bottom:.55rem">'
    + '<div class="row" style="align-items:baseline"><b>' + esc(short) + '</b><span class="note">' + esc(u.description) + '</span><span class="spacer"></span>' + state + '<span class="muted">up ' + age(u.upSeconds) + '</span></div>'
    + '<div class="row" style="align-items:baseline; margin-top:.35rem; gap:1.2rem">'
    + '<span title="processor time this service used over the last two seconds of measuring, as a share of one processor. 100 is one whole processor."><span class="k">using now</span> <b>' + (u.cpuPct == null ? '—' : u.cpuPct + '%') + '</b></span>'
    + '<span title="the most processor this service is allowed, as a share of one processor — 300 is three processors&#39; worth. Set with the box to the right."><span class="k">allowed</span> <b>' + (quota == null ? 'no ceiling' : quota + '%') + '</b></span>'
    + '<span title="memory this service is holding right now"><span class="k">memory</span> <b>' + mb(u.memoryBytes) + '</b></span>'
    + ans
    + '</div>'
    + '<div class="loadbar" title="how much of its allowance it is using right now"><div style="width:' + barPct.toFixed(0) + '%"></div></div>'
    // RULE FOUR-A: the box on its own row, and each button in a row of its own with its answer beside it
    + '<div class="row" style="margin-top:.5rem">'
    + '<label class="c"><span class="muted">ceiling, % of one processor</span><input data-quota="' + esc(u.unit) + '" type="number" min="10" max="800" step="10" value="' + (quota == null ? '' : quota) + '" style="width:6.5rem" placeholder="none set"></label>'
    + '</div>'
    + '<div class="row" style="margin-top:.5rem">'
    + '<button data-setquota="' + esc(u.unit) + '" title="applies immediately to running work, and survives the service being restarted">Set the ceiling</button>'
    + '<span class="note">' + (cSvcMsg['quota|' + u.unit] || '') + '</span>'
    + '</div>'
    + '<div class="row" style="margin-top:.5rem">'
    + '<button data-act="start" data-unit="' + esc(u.unit) + '" title="starts it if it is not running; does nothing to one that already is">Start</button>'
    + '<button data-act="restart" data-unit="' + esc(u.unit) + '" class="danger" title="stops it and starts it again. Anything it was part-way through is lost; a sweep that was going is marked as stopped and can be picked up again with Resume run on the Construct page.">Restart</button>'
    + '<button data-act="stop" data-unit="' + esc(u.unit) + '" class="danger" title="stops it and leaves it stopped">Stop</button>'

// ---- THE TRADING ENGINE (loop of 2026-09-25) --------------------------------
// The program on a machine of the owner's that carries out Paper Books and Live
// Trading for this system. Its record is made when it first calls in; its names
// and whether new setups run on it are the owner's, changed here (RULE FIVE).
// What it says of itself is read live through the link each time this tab
// refreshes.
function engineCard(e) {
  const h = e.health || {};
  // THE PRICES, IN WHAT THEY MEAN (owner, 2026-09-25: "prices prices not
  // arriving"). The engine opens Binance's price stream only for the coins it
  // holds a plan waiting or open on, so with none it follows nothing and
  // nothing arrives -- that is not a fault and is not painted as one. Red only
  // when it is following a coin and the prices are not coming.
  const feeds = (h.feeds || []).map((f) => {
    const coins = Array.isArray(f.symbols) ? f.symbols : [];
    if (!coins.length) return '<span class="muted">no coin followed — no plan waiting or open</span>';
    return f.connected ? '<span class="pos">arriving for ' + esc(coins.join(', ')) + '</span>' : '<span class="neg">not arriving for ' + esc(coins.join(', ')) + '</span>';
  }).join(' ') || '<span class="muted">—</span>';
  const said = e.answers
    ? '<span class="pos">answers</span> <span class="muted">in ' + e.ms + ' ms · release ' + esc(h.release || '?') + '</span>'
    : '<span class="neg">does not answer</span> <span class="muted">(' + esc(e.why || 'no reason given') + ')</span>';
  const link = e.link && e.link.following
    ? '<span class="pos">called in, and its record is arriving</span> <span class="muted">since ' + esc(String(e.link.since || '').slice(11, 19)) + ' UTC</span>'
    : '<span class="neg">not linked right now</span> <span class="muted">(' + esc((e.link && e.link.why) || 'not started') + ')</span>';
  // HOW IT IS REACHED (owner, 2026-09-25): an engine installed with the install
  // command calls this system and says what it is
  const mc = e.machine || {};
  // behind means other code than this system serves, not another release number
  const behind = e.current === false;
  const reach = '<span><span class="k">calls this system from</span> <b>' + esc(mc.hostname || 'a machine it has not named') + '</b> <span class="muted">' + esc([mc.platform, mc.arch].filter(Boolean).join(' ')) + '</span></span>'
    + '<span><span class="k">release</span> <b>' + esc(e.release || '?') + '</b></span>'
    + '<span><span class="k">the fingerprint of its lock</span> <b>' + esc(e.lock ? e.lock.fingerprint : '—') + '</b></span>';
  return '<div class="tile" style="margin-bottom:.55rem">'
    + '<div class="row" style="align-items:baseline"><b>' + esc(e.name) + '</b><span class="note">' + esc(e.id) + '</span>'
    + (e.isDefault ? '<span class="note pos">new setups run on this platform</span>' : '') + '<span class="spacer"></span>' + said + '</div>'
    + '<div class="row" style="align-items:baseline; margin-top:.35rem; gap:1.2rem">' + reach + '</div>'
    + (behind ? '<div class="row" style="align-items:baseline; margin-top:.25rem"><span class="note warn">this system runs ' + esc(e.releaseHere) + ' — make a new install command in its checklist and run it on the machine to bring the platform up to it</span></div>' : '')
    + '<div class="row" style="align-items:baseline; margin-top:.35rem; gap:1.2rem">'
    + '<span><span class="k">prices</span> ' + feeds + '</span>'
    + '<span><span class="k">plans held</span> <b>' + (h.plans ? h.plans.held + ' (' + h.plans.active + ' open or waiting)' : '—') + '</b></span>'
    + '<span><span class="k">real orders</span> <b>' + esc(h.realOrders || '—') + '</b></span>'
    + '<span><span class="k">the link</span> ' + link + ' <span class="muted">· ' + e.recordsKept + ' lines kept</span></span>'
    + '</div>'
    + '<div class="row" style="align-items:baseline; margin-top:.35rem"><span class="k">setups on it</span> <span class="note">'
    + (e.setups.length ? e.setups.map((s) => esc(s.name || s.id) + ' (' + esc(s.state) + ')').join(', ') : 'none') + '</span></div>'
    + '<div class="row" style="margin-top:.5rem"><button data-engedit="' + esc(e.id) + '">Change this record</button>'
    + '<button data-engdel="' + esc(e.id) + '" class="danger" title="takes the record away; refused while any setup runs on it">Delete the platform record</button></div>'
    + '</div>';

      + '<span class="note">' + (cCfg.fee.feePerLeg == null ? '—' : (100 * cCfg.fee.feePerLeg).toFixed(3) + '%') + ' each way, from ' + esc(cCfg.fee.from) + '</span></div>'
      + (cCfg.fee.set
        ? '<p class="note">Set on the <b>Account</b> tab, under the exchange it belongs to. It is entered in one place only, so this cannot disagree with that.</p>'
        : '<p class="note warn">No exchange on the <b>Account</b> tab is ticked as the system default yet, so the built-in figure is standing in. Every claim about money on the <b>Coins</b> screens is measured against this.</p>')
      : '<p class="note neg">the trading service did not answer, so this cannot be shown' + (cErrCfg ? ' — ' + esc(cErrCfg) : '') + '</p>')
    + '</div>'

    + '<div class="panel"><h3 style="margin-top:0">This machine</h3>'
    + (m ? '<div class="grid">'
      + '<div class="tile"><div class="k" title="how many processors this machine has">processors</div><div class="v">' + m.processors + '</div></div>'
      + '<div class="tile"><div class="k" title="how much work is waiting for a processor, averaged over the last minute — below the processor count means there is room, above it means things are queuing">load, last minute</div><div class="v">' + (m.load ? m.load[0].toFixed(2) : '—') + '</div></div>'
      + '<div class="tile"><div class="k" title="memory not yet spoken for, of the machine&#39;s total">memory free</div><div class="v">' + mb(m.memory && m.memory.availableBytes) + ' <span class="note">of ' + mb(m.memory && m.memory.totalBytes) + '</span></div></div>'
      + '<div class="tile"><div class="k" title="disk not yet spoken for — the sweeps write their rows here">disk free</div><div class="v">' + mb(m.disk && m.disk.freeBytes) + '</div></div>'
      + '</div>'
      : '<p class="note neg">the reporting program did not answer' + (cErrLoads ? ' — ' + esc(cErrLoads) : '') + '. It is separate from everything else here, so this means it is itself down.</p>')
    + '</div>'

    + '<div class="panel"><h3 style="margin-top:0">The services, and starting and stopping them</h3>'
    + '<p class="note">These are this system&#39;s own services — not everything on the machine. '
    + '<b>running</b> is the machine&#39;s word for alive; <b>answered</b> is measured by asking. '
    + 'A service can be running and not answering, and that is the state a Restart is for.</p>'
    + (cLoads ? cLoads.units.map(svcCard).join('') : '<p class="note neg">no reading yet</p>')
    + '</div>'

    + '<div class="panel"><h3 style="margin-top:0">How much of the machine the sweeps may take</h3>'
    + (cCfg ? '<div class="row">'
      + '<label class="c"><span class="muted">workers</span><input id="cWorkers" type="number" min="1" max="' + (cCfg.workers.max || 8) + '" step="1" value="' + (cCfg.workers.setting == null ? cCfg.workers.inForce : cCfg.workers.setting) + '" style="width:5.5rem"></label>'
      + '<label class="c"><span class="muted">each worker&#39;s share, %</span><input id="cPct" type="number" min="0" max="100" step="5" value="' + (cCfg.pct == null ? '' : cCfg.pct) + '" style="width:5.5rem"></label>'
      + '<span class="note">machine-wide that is workers &times; share — '
      + '<b>' + cCfg.workers.inForce + ' &times; ' + (cCfg.pct == null ? '—' : cCfg.pct + '%') + '</b> right now. '
      + 'The share change reaches running work within seconds; the worker count takes effect when the next job starts. 0% parks running work in place until turned back up.</span>'
      + '</div>'
      + '<div class="row" style="margin-top:.5rem"><button id="cSaveKnobs">Set these</button><span class="note">' + (cSvcMsg.knobs || '') + '</span></div>'
      : '<p class="note neg">the trading service did not answer, so these cannot be shown' + (cErrCfg ? ' — ' + esc(cErrCfg) : '') + '</p>')
    + '</div>'
    + '<div id="cOut"></div>'
    + '</div>';

  // wiring
  wireEngine();
  const now = $('#cNow');
  if (now) now.onclick = () => refreshCompute(true);
  document.querySelectorAll('[data-role]').forEach((sel) => {
    sel.onchange = async () => {
      try {
        await postJson('api/compute-config', { role: sel.dataset.role, platform: sel.value });
        $('#cOut').innerHTML = '<p class="note pos">saved — ' + esc(sel.dataset.role) + ' now points at ' + esc(sel.value) + '</p>';
      } catch (e) { $('#cOut').innerHTML = '<p class="note neg">not saved — ' + esc(e.message) + '</p>'; }
      refreshCompute(true);
    };
  });
  document.querySelectorAll('[data-setquota]').forEach((b) => {
    b.onclick = async () => {
      const unit = b.dataset.setquota;
      const box = $('[data-quota="' + unit + '"]');
      const short = unit.replace(/\.service$/, '');
      if (!confirm('Set the ceiling for "' + short + '" to ' + box.value + '% of one processor?\n\nIt applies immediately, including to running work.')) return;
      try {
        const out = await postJson('svc/api/quota', { unit, percent: Number(box.value), confirm: unit });
        cSvcMsg['quota|' + unit] = '<span class="pos">' + esc(short) + ' is now allowed ' + esc(out.quotaPct) + '%</span>';
      } catch (e) { cSvcMsg['quota|' + unit] = '<span class="neg">not set — ' + esc(e.message) + '</span>'; }
      refreshCompute(true);
    };
  });
  document.querySelectorAll('[data-act]').forEach((b) => {
    b.onclick = async () => {
      const unit = b.dataset.unit;
      const action = b.dataset.act;
      const short = unit.replace(/\.service$/, '');
      if (!confirm((action === 'start' ? 'Start' : action === 'stop' ? 'Stop' : 'Restart') + ' "' + short + '"?\n\n'
        + (action === 'start' ? 'It does nothing to one that is already running.'
          : 'Anything it is part-way through is lost. A sweep that was going is marked as stopped, and can be picked up again with Resume run on the Construct page.')
        + '\n\nHit Cancel and nothing is done.')) return;
      try {
        const out = await postJson('svc/api/service', { unit, action, confirm: unit });
        cSvcMsg['act|' + unit] = '<span class="pos">' + esc(short) + ': ' + esc(out.was) + ' &rarr; ' + esc(out.now) + '</span>';
      } catch (e) { cSvcMsg['act|' + unit] = '<span class="neg">it did not go through — ' + esc(e.message) + '</span>'; }
      drawCompute();
      setTimeout(() => refreshCompute(true), 2500);
    };
  });
  const save = $('#cSaveKnobs');
  if (save) save.onclick = async () => {
    try {
      await postJson('api/compute-config', { workers: Number($('#cWorkers').value), pct: Number($('#cPct').value) });
      cSvcMsg.knobs = '<span class="pos">saved</span>';
    } catch (e) { cSvcMsg.knobs = '<span class="neg">not saved — ' + esc(e.message) + '</span>'; }
    refreshCompute(true);
  };
}

async function refreshCompute(force) {
  if (tab !== 'compute' && !force) return;
  await loadCompute();
  if (tab === 'compute') drawCompute();
}

// ---- Version (owner order, 2026-09-08) ----------------------------------------
// The release this box runs, and the check that certifies it: the stage-engine
// check, which builds two fabricated coins with a known answer into the price
// cache and runs the real three stages on them. It moved here whole from the
// Construct page's Verify tab; the marker beside "stage-engine check:" at the
// top of every Construct screen opens this tab. Self-contained like the rest
// of this page: the panel is drawn from the check's own status reading and
// nothing else, and a service that did not answer is said to have not
// answered rather than read as NOT CHECKED.
async function loadVersion() {
  try { vSg = await getJson('api/stage-gate/status'); vErr = null; } catch (e) { vSg = null; vErr = e.message; }
}

const SG_TIP = "runs the calibration check through the three-stage engine: two made-up coins, one with a known rule planted in it and one with nothing, through stage 1, stage 2 and a small stage 3, then a rule declared in advance is cut into a Stage 4 set on each coin and read the way Verify reads one. It takes minutes, refuses while anything else is running, and deletes everything it made when it lands, so nothing of it appears on Boards. A pass belongs to the release that earned it.";

function stageGateHtml(sg) {
  const s = sg || {};
  const run = s.run || null;
  const last = s.last || null;
  const cls = s.state === 'RUNNING' ? 'warn' : s.state === 'PASS' ? 'pos' : s.state === 'FAIL' ? 'neg' : 'muted';
  return `<div class="panel">
    <h3 style="margin-top:0">The stage-engine check — the instrument's calibration certificate</h3>
    <p class="note">The same question asked of the engine that prices the record sets on Boards: two fabricated
      coins, one with a known rule planted in it and one with nothing, through stage 1, stage 2, a small stage 3
      with every scrambled copy kept, a rule declared before anything is launched and cut into a Stage 4 set on
      each, and the verdict read on both. PASS = the planted coin's rule made held-back money, beat buying the coin
      and going away, beat every one of its ${Number(s.last && s.last.copies ? s.last.copies : 20)} scrambled copies, the fair coin's rule did not, and nothing
      failed. A fair coin clears that bar by chance about 1 in ${Number(s.last && s.last.copies ? s.last.copies : 20) + 1} times, and that chance is printed with every
      verdict. A pass belongs to the release that earned it; a new release starts NOT CHECKED. Everything it
      makes is deleted when it lands, so nothing of it is ever on Boards.</p>
    <div class="row"><span>current: <b class="${cls}">${esc(s.state || 'NOT CHECKED')}</b>
      ${last && last.release ? `<span class="muted">(release ${esc(last.release)})</span>` : ''}</span>
      <button id="sgRun" class="pri" ${s.state === 'RUNNING' ? 'disabled title="the stage-engine check is already running"' : s.blockedBy ? `disabled title="sleeping: ${esc(s.blockedBy)} — the check waits for the box to be free"` : `title="${SG_TIP}"`}>Run the stage-engine check</button>
      <span id="sgMsg" class="note">${s.state === 'RUNNING' && run ? `running now — ${esc(run.step || '')}` : s.blockedBy ? `sleeping — ${esc(s.blockedBy)}; the check fabricates two coins and runs all three stages, so it waits for the box to be free` : ''}</span></div>
    ${s.detail ? `<p class="note">${esc(s.detail)}</p>` : ''}
    ${s.state === 'RUNNING' ? '<p class="note">This fabricates two coins and runs all three stages on them, so it takes minutes. This tab re-reads itself every five seconds while it runs — you do not need to reload.</p>' : ''}
    ${run && run.error ? `<p class="note"><b class="neg">The last press failed:</b> ${esc(run.error)}</p>` : ''}
    ${last && last.sentences && last.sentences.length ? `<div class="note"><b>Last stage gate (${esc(last.id || '')}, release ${esc(last.release || '')}, ${last.pass ? 'PASS' : 'FAIL'}${last.elapsedMs ? `, ${Math.round(last.elapsedMs / 1000)} s` : ''}${last.span ? `, built on fabricated prices from ${esc(last.span.fromMonth)} to ${esc(last.span.toDate)}` : ''}):</b>
      ${last.sentences.map((x) => `<div>${esc(x)}</div>`).join('')}</div>` : ''}
    ${sg ? `<details style="margin-top:.4rem"><summary>full stage-gate record</summary><pre>${esc(JSON.stringify(sg, null, 1))}</pre></details>` : ''}
  </div>`;
}
// A press that got no answer in time is not a press that failed: the service
// may still be working on it, and the next re-read says so.
const pressFailed = (e) => (/HTTP 50[24]\b/.test(String(e.message))
  ? 'no answer in time — the service may still be working on it; the next re-read says so'
  : 'not started — ' + esc(e.message));
function drawVersion() {
  const sg = vSg;
  const state = sg ? (sg.state || 'NOT CHECKED') : '—';
  const cls = state === 'RUNNING' ? 'warn' : state === 'PASS' ? 'pos' : state === 'FAIL' ? 'neg' : 'muted';
  $('#view').innerHTML = '<div class="row" style="margin-bottom:.6rem">'
    + '<span class="note">release <b>' + esc(sg && sg.release ? sg.release : '—') + '</b> · stage-engine check: '
    + '<b class="' + cls + '">' + esc(state) + '</b> · re-read every five seconds while this tab is open.</span>'
    + '<span class="spacer"></span>'
    + '<button id="vNow" title="asks again right now instead of waiting for the five seconds">Read it again</button>'
    + '</div>'
    + (sg ? stageGateHtml(sg)
      : '<div class="panel"><p class="note neg">the trading service did not answer, so the check cannot be shown' + (vErr ? ' — ' + esc(vErr) : '') + '</p></div>');

  // wiring
  const now = $('#vNow');
  if (now) now.onclick = () => refreshVersion(true);
  const sgBtn = $('#sgRun');
  if (sgBtn) sgBtn.onclick = async () => {
    if (!confirm('Run the stage-engine check?\n\nFabricates two coins and runs stage 1, stage 2 and a small stage 3 on them, then cuts and reads a Stage 4 set on each. Minutes. It refuses while any other job or stage run is going, and nothing else can start while it runs. Everything it makes is deleted when it lands.')) return;
    sgBtn.disabled = true;
    $('#sgMsg').textContent = 'starting…';
    try {
      await postJson('api/stage-gate', {});
    } catch (e) {
      $('#sgMsg').innerHTML = '<span class="neg">' + pressFailed(e) + '</span>';
      sgBtn.disabled = false;
      return;
    }
    refreshVersion(true);
  };
}

// Re-read every five seconds while the tab shows, and redraw only when the
// reading changed: a running check's step line moves, an idle tab stays still
// and keeps whatever the owner has opened.
async function refreshVersion(force) {
  if (tab !== 'version' && !force) return;
  const before = JSON.stringify([vSg, vErr]);
  await loadVersion();
  if (tab !== 'version') return;
  if (force || before !== JSON.stringify([vSg, vErr])) drawVersion();
}

function draw() {
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t.dataset.tab === tab));
  clearInterval(cTimer); cTimer = null;
  clearInterval(vTimer); vTimer = null;
  if (tab === 'compute') {
    $('#view').innerHTML = '<div class="panel"><span class="muted">reading…</span></div>';
    refreshCompute(true);
    // every thirty seconds while this tab is open, per the owner's design
    cTimer = setInterval(() => refreshCompute(false), 30000);
  } else if (tab === 'version') {
    $('#view').innerHTML = '<div class="panel"><span class="muted">reading…</span></div>';
    refreshVersion(true);
    // every five seconds while this tab is open, so a running check is followed without a reload
    vTimer = setInterval(() => refreshVersion(false), 5000);
  } else {
    $('#view').innerHTML = '<div class="panel"><span class="muted">reading…</span></div>';
    loadAccount().then(() => { if (tab === 'account') drawAccount(); });
  }
}
document.querySelectorAll('.tab').forEach((t) => {
  t.onclick = () => { tab = t.dataset.tab; localStorage.setItem('setup-tab', tab); draw(); };
});
draw();
</script>
</body>
</html>
