# QNAP WireGuard Configuration
# Location: /etc/wireguard/wg0.conf
#
# Before using, replace:
#   QNAP_PRIVATE_KEY  - generated by: wg genkey
#   VPS_PUBLIC_KEY     - from the VPS's key pair
#   VPS_PUBLIC_IP      - the public IP address of your VPS

[Interface]
Address = 10.0.0.2/24
PrivateKey = QNAP_PRIVATE_KEY

[Peer]
# VPS
PublicKey = VPS_PUBLIC_KEY
Endpoint = VPS_PUBLIC_IP:51820
AllowedIPs = 10.0.0.1/32
# Keep the tunnel alive since QNAP is behind NAT
PersistentKeepalive = 25
