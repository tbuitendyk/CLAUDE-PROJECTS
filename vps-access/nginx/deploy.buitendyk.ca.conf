# deploy.buitendyk.ca -- scoped HTTPS deploy endpoint.
#
# This box terminates TLS for each site on a loopback port and routes by SNI
# through the `map $ssl_preread_server_name $backend` stream block in
# /etc/nginx/nginx.conf (same pattern as www.buitendyk.ca). To wire this vhost
# in, add a line to that map:
#
#     deploy.buitendyk.ca   127.0.0.1:4433;
#
# (4433 is just this vhost's loopback port below -- pick another free port if it
# collides, and change both places.) Then you need a TLS cert for
# deploy.buitendyk.ca (see install-deploy-control.sh for the certbot step).
#
# Requests are reverse-proxied to the local deploy-control service, which is the
# only thing that can invoke `sudo claude-deploy`.

# Rate-limit: a deploy endpoint should see a trickle of calls, never a flood.
limit_req_zone $binary_remote_addr zone=deployapi:10m rate=12r/m;

server {
    listen 127.0.0.1:4433 ssl;
    http2 on;
    server_name deploy.buitendyk.ca;

    ssl_certificate     /etc/letsencrypt/live/deploy.buitendyk.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/deploy.buitendyk.ca/privkey.pem;

    # It's a tiny JSON control API -- cap the body hard.
    client_max_body_size 16k;

    # Don't advertise the backend.
    proxy_hide_header X-Powered-By;
    server_tokens off;

    location = /run {
        limit_req zone=deployapi burst=4 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Deploys can take minutes; let the upstream finish.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8090;
    }

    # Everything else is closed.
    location / { return 404; }
}
