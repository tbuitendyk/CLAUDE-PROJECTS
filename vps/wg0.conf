# VPS WireGuard Configuration
# Location: /etc/wireguard/wg0.conf
#
# Before using, replace:
#   VPS_PRIVATE_KEY   - generated by: wg genkey
#   QNAP_PUBLIC_KEY   - from the QNAP's key pair

[Interface]
Address = 10.0.0.1/24
ListenPort = 51820
PrivateKey = VPS_PRIVATE_KEY

# Forward SMB (port 445) from VPS public IP to QNAP through the tunnel
PostUp = iptables -t nat -A PREROUTING -i eth0 -p tcp --dport 445 -j DNAT --to-destination 10.0.0.2:445
PostUp = iptables -A FORWARD -i eth0 -o wg0 -p tcp --dport 445 -j ACCEPT
PostUp = iptables -A FORWARD -i wg0 -o eth0 -m state --state RELATED,ESTABLISHED -j ACCEPT
PostUp = iptables -t nat -A POSTROUTING -o wg0 -j MASQUERADE
PostUp = sysctl -w net.ipv4.ip_forward=1

PostDown = iptables -t nat -D PREROUTING -i eth0 -p tcp --dport 445 -j DNAT --to-destination 10.0.0.2:445
PostDown = iptables -D FORWARD -i eth0 -o wg0 -p tcp --dport 445 -j ACCEPT
PostDown = iptables -D FORWARD -i wg0 -o eth0 -m state --state RELATED,ESTABLISHED -j ACCEPT
PostDown = iptables -t nat -D POSTROUTING -o wg0 -j MASQUERADE

[Peer]
# QNAP
PublicKey = QNAP_PUBLIC_KEY
AllowedIPs = 10.0.0.2/32
# QNAP is behind NAT, so no Endpoint needed here — it connects to us
