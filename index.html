<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(60% 50% at 50% 30%, #101b36, #060b18 75%);
    color: #edf1f8; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 24px;
  }
  .wm { font-size: clamp(1.5rem, 5vw, 2.6rem); font-weight: 700; letter-spacing: .02em; }
  .wm .t { color: #3f8cff; }
  .sub { letter-spacing: .55em; text-transform: uppercase; font-size: .8rem; color: #c7cedb; margin-top: 10px; }
  .tag { margin-top: 26px; color: #93a0b8; font-size: .9rem; }
  .line { width: 74px; height: 3px; background: linear-gradient(90deg, #3f8cff, #0b3fa6); margin: 30px auto 0; border-radius: 2px; }
</style>
</head>
<body>
  <div>
    <div class="wm">UNION <span class="t">TRADING</span></div>
    <div class="sub">Academy</div>
    <div class="line"></div>
    <p class="tag">Order Flow | Volume Profile | Trading Profesional<br>Muy pronto.</p>

</html>
