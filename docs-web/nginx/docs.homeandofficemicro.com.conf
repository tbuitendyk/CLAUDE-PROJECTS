# /etc/nginx/sites-available/docs.homeandofficemicro.com.conf
#
# Sits behind the nginx stream/SNI router on :443 (the one with
# `map $ssl_preread_server_name $backend`). The stream block forwards
# raw TLS for docs.homeandofficemicro.com to 127.0.0.1:4431, and this
# vhost terminates it.

server {
    listen 127.0.0.1:4431 ssl;
    server_name docs.homeandofficemicro.com;

    ssl_certificate     /etc/letsencrypt/live/docs.homeandofficemicro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docs.homeandofficemicro.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/docs.homeandofficemicro.com;

    # Whole site is behind HTTP Basic Auth.
    auth_basic           "docs.homeandofficemicro.com";
    auth_basic_user_file /etc/nginx/htpasswd/docs.homeandofficemicro.com;

    add_header X-Content-Type-Options nosniff   always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        no-referrer always;

    # Browseable: every directory shows its contents. No index.html short-circuit.
    autoindex            on;
    autoindex_exact_size off;
    autoindex_localtime  on;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/docs.homeandofficemicro.com.access.log;
    error_log  /var/log/nginx/docs.homeandofficemicro.com.error.log;
}
