# Patch for the existing stream { map $ssl_preread_server_name $backend { ... } }
# block. Add the docs.homeandofficemicro.com line above `default`.
# The `default` route is what carries everything else to the iRedMail VM
# (192.168.56.129:443), including Roundcube at /mail. Since 2026-09-27 it goes
# there through the hop on 127.0.0.1:4450: the front door sends each caller's
# address ahead of the connection (`proxy_protocol on;`), every site behind it
# reads it (`listen ... proxy_protocol`), and the hop takes it off again for the
# VM, which does not expect it. Do NOT point `default` straight at the VM while
# `proxy_protocol on;` stands -- the mail server would stop answering. See
# vps-access/scripts/nginx-frontdoor-apply.sh.

stream {
    map $ssl_preread_server_name $backend {
        kjv.buitendyk.ca               127.0.0.1:4430;
        vp.buitendyk.ca                127.0.0.1:4430;
        bible.buitendyk.ca             127.0.0.1:4430;
        docs.homeandofficemicro.com    127.0.0.1:4431;
        buitendyk.ca                   127.0.0.1:4432;
        www.buitendyk.ca               127.0.0.1:4432;
        deploy.buitendyk.ca            127.0.0.1:4433;
        default                        127.0.0.1:4450;
    }
    server {
        listen 127.0.0.1:4450 proxy_protocol;
        proxy_pass 192.168.56.129:443;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
    server {
        listen 443;
        ssl_preread on;
        proxy_protocol on;
        proxy_pass $backend;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
}
