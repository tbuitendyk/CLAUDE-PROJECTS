# Patch for the existing stream { map $ssl_preread_server_name $backend { ... } }
# block. Add the docs.homeandofficemicro.com line above `default`.
# Do NOT change the `default` route — that's what carries everything to the
# iRedMail VM (192.168.56.129:443), including Roundcube at /mail.

stream {
    map $ssl_preread_server_name $backend {
        kjv.buitendyk.ca               127.0.0.1:4430;
        vp.buitendyk.ca                127.0.0.1:4430;
        bible.buitendyk.ca             127.0.0.1:4430;
        docs.homeandofficemicro.com    127.0.0.1:4431;
        default                        192.168.56.129:443;
    }
    server {
        listen 443;
        ssl_preread on;
        proxy_pass $backend;
        proxy_connect_timeout 5s;
        proxy_timeout 300s;
    }
}
