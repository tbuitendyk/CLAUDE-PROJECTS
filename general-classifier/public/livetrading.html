<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Trading</title>
<style>
  /* THEME TOKENS (NEXT-RELEASE point 24): dark = the F1 pilot's compact
     technical style (the baseline); light = the Bracket Lab register. A single
     [data-theme] switch flips every surface. Carries into UTS unchanged. */
  :root, :root[data-theme="dark"] {
    --bg:#0e1116; --fg:#d6dce5; --muted:#6b7686; --dim:#8b96a5;
    --panel:#12161d; --tile:#171c24; --line:#232a35;
    --pos:#4ec9a5; --neg:#e06c75; --warn:#e5c07b; --accent:#9db4d0;
    --paper:#3b3320; --paperln:#e5c07b; --tabbg:#171c24; --tabon:#0e1116;
  }
  :root[data-theme="light"] {
    --bg:#f6f7f9; --fg:#1a2028; --muted:#8a94a2; --dim:#5a6472;
    --panel:#ffffff; --tile:#ffffff; --line:#dde2e8;
    --pos:#0a7d55; --neg:#c02a33; --warn:#8a6d00; --accent:#2c5fa8;
    --paper:#fff6da; --paperln:#8a6d00; --tabbg:#eceef1; --tabon:#ffffff;
  }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,system-ui,sans-serif; margin:0; padding:1.1rem;
         background:var(--bg); color:var(--fg); font-size:14px; }
  h1 { font-size:1.15rem; margin:0 0 .2rem; }
  .sub { color:var(--dim); font-size:.8rem; margin-bottom:.9rem; }
  a { color:var(--accent); }
  .row { display:flex; align-items:center; gap:.8rem; flex-wrap:wrap; }
  .spacer { flex:1; }
  .muted { color:var(--muted); } .pos{color:var(--pos);} .neg{color:var(--neg);} .warn{color:var(--warn);}
  .tabs { display:flex; gap:.25rem; border-bottom:1px solid var(--line); margin:.4rem 0 1rem; flex-wrap:wrap; }
  .tab { background:var(--tabbg); border:1px solid var(--line); border-bottom:none;
         border-radius:7px 7px 0 0; padding:.4rem .8rem; cursor:pointer; color:var(--dim); font-size:.82rem; }
  .tab.on { background:var(--tabon); color:var(--fg); font-weight:600; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:.8rem .9rem; margin-bottom:1rem; }
  table { width:100%; border-collapse:collapse; font-size:.82rem; }
  th,td { text-align:right; padding:.35rem .5rem; border-bottom:1px solid var(--line); font-variant-numeric:tabular-nums; }
  th:first-child,td:first-child { text-align:left; }
  th { color:var(--dim); font-weight:600; font-size:.68rem; text-transform:uppercase; }
  tr.clickable { cursor:pointer; } tr.clickable:hover td { background:var(--tile); }
  .tile { background:var(--tile); border:1px solid var(--line); border-radius:8px; padding:.55rem .7rem; }
  .k { color:var(--dim); font-size:.66rem; text-transform:uppercase; letter-spacing:.04em; }
  .v { font-size:1.1rem; margin-top:.15rem; font-variant-numeric:tabular-nums; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:.55rem; }
  .badge { display:inline-block; font-size:.62rem; font-weight:700; text-transform:uppercase;
           padding:.1rem .4rem; border-radius:4px; letter-spacing:.04em; vertical-align:middle; }
  .b-paper { background:var(--paper); color:var(--paperln); border:1px solid var(--paperln); }
  .b-live  { background:transparent; color:var(--pos); border:1px solid var(--pos); }
  .b-draft { background:transparent; color:var(--muted); border:1px solid var(--line); }
  .b-stopped{background:transparent; color:var(--warn); border:1px solid var(--warn); }
  .b-retired{background:transparent; color:var(--muted); border:1px solid var(--line); }
  button { font:inherit; border:1px solid var(--line); background:var(--tile); color:var(--fg);
           border-radius:6px; padding:.35rem .8rem; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.pri { background:var(--accent); color:var(--bg); border-color:var(--accent); font-weight:600; }
  button:disabled { opacity:.45; cursor:default; }
  .themebtn { font-size:.72rem; padding:.25rem .6rem; }
  .cfgrow { display:flex; justify-content:space-between; gap:1rem; border-bottom:1px solid var(--line); padding:.2rem 0; font-size:.82rem; }
  .cfgrow .lbl { color:var(--dim); }
  .empty { color:var(--muted); padding:1rem 0; }
  code { color:var(--accent); font-size:.82rem; }
</style>
</head>
<body>
  <!-- site nav (owner, 2026-08-12): portal home + classifier home, styled with
       this page's own theme tokens since it deliberately does not use style.css -->
  <div class="row" style="border-bottom:1px solid var(--line); padding-bottom:.55rem; margin-bottom:.8rem; font-size:.85rem">
    <a href="https://www.buitendyk.ca/" style="text-decoration:none; font-weight:700; color:var(--fg)">buitendyk<span style="color:var(--accent)">.ca</span></a>
    <span class="muted">/ general classifier / live trading</span>
    <div class="spacer"></div>
    <a href="index.html" style="text-decoration:none; border:1px solid var(--line); border-radius:6px; padding:.25rem .6rem; color:var(--fg); background:var(--tile)">Back to the app</a>
  </div>
  <div class="row">
    <h1 style="margin:0">Live Trading</h1>
    <span id="utcClock" class="muted" title="all system times are UTC" style="font-variant-numeric:tabular-nums">—</span>
    <div class="spacer"></div>
    <button class="themebtn" id="themebtn">◐ theme</button>
  </div>
  <div class="sub">Deterministic execution of greenlighted Bracket Lab configurations — no AI in this path.
    Paper and live setups share this surface; a <span class="badge b-paper">paper</span> badge marks any
    setup that is <b>not real money</b>.</div>

  <div class="tabs" id="tabs"></div>
  <div id="view"></div>

<script>
const $ = (s,r=document)=>r.querySelector(s);
const api = (p)=>fetch(p).then(r=>r.json());
async function post(p, body){
  // control action: a non-2xx MUST surface (the QC-115 lesson), never a silent no-op.
  try{
    const r = await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body||{})});
    if(!r.ok){ let m=`HTTP ${r.status}`; try{const j=await r.json(); if(j&&j.error)m=j.error;}catch(_){}
      alert('Action FAILED — nothing changed.\n\n'+m); return null; }
    return await r.json();
  }catch(e){ alert('Action FAILED — could not reach the server.\n\n'+e); return null; }
}
const money=(v)=>v==null?'—':(v>=0?'+':'')+Number(v).toFixed(4);
const cls=(v)=>v==null?'':v>0?'pos':v<0?'neg':'';
const stateBadge=(s)=>`<span class="badge b-${s}">${s}</span>`;

// theme: remember choice; default dark (the technical baseline).
const root=document.documentElement;
root.setAttribute('data-theme', localStorage.getItem('lt-theme')||'dark');
$('#themebtn').onclick=()=>{ const n=root.getAttribute('data-theme')==='dark'?'light':'dark';
  root.setAttribute('data-theme',n); localStorage.setItem('lt-theme',n); };

const TABS=[
  ['setups','Setups'],
  ['greenlights','Greenlights'],
  ['detail','Setup detail'],
];
let current='setups', selectedId=null;
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(([k,l])=>`<div class="tab ${k===current?'on':''}" data-k="${k}">${l}</div>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ current=t.dataset.k; draw(); });
}

async function drawSetups(){
  const d=await api('api/live/setups');
  const rows=(d.setups||[]);
  if(!rows.length){ $('#view').innerHTML=`<div class="panel empty">No live trading setups yet. Greenlight a Bracket Lab
    configuration, then shuttle it here — that is the only way a setup is created.</div>`; return; }
  $('#view').innerHTML=`<div class="panel"><table><thead><tr>
    <th>setup</th><th>pair</th><th>state</th><th>clip</th><th>stop</th><th>engine</th><th>created</th></tr></thead><tbody>
    ${rows.map(s=>`<tr class="clickable" data-id="${s.id}">
      <td>${s.name} ${s.state==='paper'?stateBadge('paper'):''}</td>
      <td>${s.tradedPair}</td><td>${stateBadge(s.state)}</td>
      <td>$${Number(s.clipUsd).toFixed(0)}</td>
      <td>${s.stopPct==null?'—':(s.stopPct*100).toFixed(2)+'%'}</td>
      <td class="muted" style="font-size:.7rem">${s.engineVersion||''}</td>
      <td class="muted" style="font-size:.72rem">${(s.createdUtc||'').slice(0,16)}</td></tr>`).join('')}
  </tbody></table></div>`;
  $('#view').querySelectorAll('tr[data-id]').forEach(tr=>tr.onclick=()=>{ selectedId=tr.dataset.id; current='detail'; draw(); });
}

async function drawGreenlights(){
  const d=await api('api/live/greenlights');
  const gs=(d.greenlights||[]);
  if(!gs.length){ $('#view').innerHTML=`<div class="panel empty">No greenlights yet. A greenlight is the recorded
    decision that a lab configuration is fit to trade; the shuttle button then mints a draft setup from it.</div>`; return; }
  $('#view').innerHTML=`<div class="panel"><table><thead><tr>
    <th>greenlight</th><th>pair</th><th>target</th><th>campaign</th><th>why</th><th>shuttled</th><th></th></tr></thead><tbody>
    ${gs.map(g=>`<tr>
      <td class="muted" style="font-size:.72rem">${(g.createdUtc||'').slice(0,16)}</td>
      <td>${g.configSnapshot?.combo?.trade||'—'}</td><td>${g.target}</td>
      <td>${g.campaign||'—'}</td>
      <td style="max-width:22rem;white-space:normal;text-align:left">${(g.why||'').replace(/</g,'&lt;')}</td>
      <td>${(g.shuttledSetupIds||[]).length}</td>
      <td><button data-gl="${g.id}">Shuttle → setup</button></td></tr>`).join('')}
  </tbody></table></div>`;
  $('#view').querySelectorAll('button[data-gl]').forEach(b=>b.onclick=async()=>{
    const name=prompt('Name for the new live setup:'); if(name==null)return;
    const clip=prompt('Clip size (USD notional per trade):','10'); if(clip==null)return;
    const out=await post('api/live/shuttle',{greenlightId:b.dataset.gl,name,clipUsd:Number(clip)});
    if(out){ selectedId=out.setup.id; current='detail'; draw(); }
  });
}

async function drawDetail(){
  if(!selectedId){ $('#view').innerHTML=`<div class="panel empty">Select a setup from the Setups tab.</div>`; return; }
  const s=await api('api/live/setups/'+selectedId);
  if(s.error){ $('#view').innerHTML=`<div class="panel empty">${s.error}</div>`; return; }
  const c=s.configSnapshot||{}, cell=c.cell||{}, br=c.branch||{}, combo=c.combo||{};
  const trans={draft:['paper','live'],paper:['live','stopped'],live:['stopped'],stopped:['paper','live','retired'],retired:[]}[s.state]||[];
  $('#view').innerHTML=`
    <div class="panel"><div class="row">
      <b style="font-size:1rem">${s.name}</b> ${stateBadge(s.state)} ${s.state==='paper'?'<span class="badge b-paper">not real money</span>':''}
      <div class="spacer"></div>
      ${trans.map(t=>`<button data-to="${t}" class="${t==='live'?'pri':''}">${t==='live'?'Go LIVE':t==='paper'?'Run PAPER':t==='stopped'?'STOP':'Retire'}</button>`).join('')}
    </div>
    <div class="muted" style="font-size:.74rem;margin-top:.3rem">state controls change eligibility; opening real positions still
      requires this setup's ARM switch on the box. ${s.state==='live'?'<b class="warn">LIVE — real money when armed.</b>':''}</div>
    </div>

    <div class="grid" style="margin-bottom:1rem">
      <div class="tile"><div class="k">Pair</div><div class="v">${s.tradedPair}</div></div>
      <div class="tile"><div class="k">Clip</div><div class="v">$${Number(s.clipUsd).toFixed(0)}</div></div>
      <div class="tile"><div class="k">Stop</div><div class="v">${s.stopPct==null?'none':(s.stopPct*100).toFixed(2)+'%'}</div></div>
      <div class="tile"><div class="k">Key</div><div class="v ${s.keyRef?'pos':'muted'}">${s.keyRef?'set':'none'}</div></div>
      <div class="tile"><div class="k">Exec target</div><div class="v muted" style="font-size:.9rem">${s.executionTargetRef||'default'}</div></div>
    </div>

    <div class="panel">
      <div class="k">Frozen configuration (immutable — from greenlight ${s.provenanceRef||'—'})</div>
      <div style="margin-top:.5rem">
        ${cfgRow('Traded / context', `${combo.trade} + ${combo.ctx1} + ${combo.ctx2}`)}
        ${cfgRow('Geometry', `${br.geometry} · ${br.decision} · band ${br.band}%`)}
        ${cfgRow('Committee', `${(c.members||[]).length} members (${c.stage})`)}
        ${cfgRow('Quorum / entry / gate', `${cell.quorum}-of-${(c.members||[]).length} · ${cell.entry} · ${cell.gate}`)}
        ${cfgRow('Hold', `${cell.tHours}h`)}
        ${cfgRow('Trained through', new Date(c.trainThrough).toISOString().slice(0,10))}
        ${cfgRow('Config version', `<code>${c.configVersion||''}</code>`)}
        ${cfgRow('Engine version', `<code>${s.engineVersion||''}</code>`)}
      </div>
    </div>
    <div class="panel"><div class="k">Config editor (operational only — snapshot never changes)</div>
      <div class="row" style="margin-top:.5rem">
        <label class="muted">Clip $ <input id="clipIn" type="number" min="1" step="1" value="${s.clipUsd}" style="width:6rem"></label>
        <label class="muted">Stop % <input id="stopIn" type="number" min="0" step="0.01" value="${s.stopPct==null?'':(s.stopPct*100)}" placeholder="none" style="width:6rem"></label>
        <button id="saveCfg">Save</button>
      </div>
    </div>
    <div id="bookPanel"></div>`;
  // per-setup book + fidelity (plan phase 6), fetched from the synced journal
  api('api/live/setups/'+s.id+'/status').then(st=>{
    if(!$('#bookPanel')) return;
    if(st.error){ $('#bookPanel').innerHTML=`<div class="panel empty">${st.error}</div>`; return; }
    const isPaper = st.paper;
    const rp = isPaper ? st.paperRealizedPnl : st.realizedPnl;
    // R9: show the setup's OWN book (real for live, paper for paper) — never a
    // mixed real+paper number. paperUnrealizedPnl / unrealizedPnl are kept separate.
    const up = isPaper ? st.paperUnrealizedPnl : st.unrealizedPnl;
    $('#bookPanel').innerHTML=`
      <div class="grid" style="margin-bottom:1rem">
        <div class="tile"><div class="k">${isPaper?'Paper realized':'Realized'} P&L</div><div class="v ${cls(rp)}">${money(rp)}</div></div>
        <div class="tile"><div class="k">${isPaper?'Paper unrealized':'Unrealized'} P&L</div><div class="v ${cls(up)}">${money(up)}</div></div>
        <div class="tile"><div class="k">Mark (last run)</div><div class="v">${st.markPrice==null?'—':'$'+st.markPrice.toFixed(2)}</div></div>
        <div class="tile"><div class="k">Open positions</div><div class="v">${st.openPositions.length}</div></div>
        <div class="tile"><div class="k">Fill dev avg</div><div class="v">${st.fidelity.fillDeviationAvg==null?'—':(st.fidelity.fillDeviationAvg*100).toFixed(3)+'%'}</div></div>
        <div class="tile"><div class="k">Fill dev max</div><div class="v ${st.fidelity.fillDeviationMax>0.01?'warn':''}">${st.fidelity.fillDeviationMax==null?'—':(st.fidelity.fillDeviationMax*100).toFixed(3)+'%'}</div></div>
      </div>
      <div class="panel"><div class="k">Open positions ${isPaper?'<span class="badge b-paper">paper</span>':''}</div>
        <table style="margin-top:.4rem"><thead><tr><th>chunk</th><th>side</th><th>qty</th><th>entry</th><th>mark</th><th>unreal $</th><th>exit due</th></tr></thead><tbody>
        ${st.openPositions.length?st.openPositions.map(p=>`<tr>
          <td>${(p.chunk_start||'').slice(0,16)}</td><td class="${p.side==='LONG'?'pos':'neg'}">${p.side}${p.paper?' <span class="badge b-paper">P</span>':''}</td>
          <td>${p.qty}</td><td>${p.entry_price??'—'}</td><td>${p.markPrice==null?'—':'$'+p.markPrice.toFixed(2)}</td>
          <td class="${cls(p.unrealized)}">${money(p.unrealized)}</td>
          <td class="muted">${p.exit_due_ts?new Date(p.exit_due_ts*1000).toISOString().slice(0,16):'—'}</td></tr>`).join(''):'<tr><td colspan="7" class="empty">none open</td></tr>'}
        </tbody></table></div>
      <div class="panel"><div class="k">Recent closed</div>
        <table style="margin-top:.4rem"><thead><tr><th>chunk</th><th>side</th><th>entry</th><th>exit</th><th>P&L</th></tr></thead><tbody>
        ${st.closedRecent.length?st.closedRecent.map(c=>`<tr>
          <td>${(c.chunk_start||'').slice(0,16)}</td><td class="${c.side==='LONG'?'pos':'neg'}">${c.side}${c.paper?' <span class="badge b-paper">P</span>':''}</td>
          <td>${c.entry_price??'—'}</td><td>${c.exit_price??'—'}</td><td class="${cls(c.pnl)}">${money(c.pnl)}</td></tr>`).join(''):'<tr><td colspan="5" class="empty">none closed yet</td></tr>'}
        </tbody></table></div>`;
  });

  $('#view').querySelectorAll('button[data-to]').forEach(b=>b.onclick=async()=>{
    const to=b.dataset.to;
    if((to==='live') && !confirm(`Set "${s.name}" to LIVE?\n\nLive setups open REAL positions when armed on the box.`)) return;
    const out=await post(`api/live/setups/${s.id}/state`,{to}); if(out) draw();
  });
  $('#saveCfg').onclick=async()=>{
    const clipUsd=Number($('#clipIn').value);
    const raw=$('#stopIn').value.trim();
    const stopPct = raw===''? null : Number(raw)/100;
    const out=await post(`api/live/setups/${s.id}/config`,{clipUsd, stopPct}); if(out) draw();
  };
}
function cfgRow(l,v){ return `<div class="cfgrow"><span class="lbl">${l}</span><span>${v}</span></div>`; }

function draw(){ renderTabs();
  if(current==='setups') drawSetups();
  else if(current==='greenlights') drawGreenlights();
  else drawDetail();
}
function tickClock(){ $('#utcClock').textContent=new Date().toISOString().slice(0,19).replace('T',' ')+' UTC'; }
tickClock(); setInterval(tickClock,1000);
draw(); setInterval(()=>{ if(current!=='detail') draw(); }, 15000);
</script>
</body>
</html>
