# nginx site config for https://www.buitendyk.ca
#
# Sits behind the nginx stream/SNI router on :443 (the one in nginx.conf with
# `map $ssl_preread_server_name $backend`), the same way
# docs.homeandofficemicro.com.conf does. The stream block forwards raw TLS
# for buitendyk.ca / www.buitendyk.ca to 127.0.0.1:4432, and these vhosts
# terminate it. (4430 and 4431 are already taken by the kjv/bible/vp and
# docs vhosts respectively -- see /etc/nginx/nginx.conf's stream{} map,
# which needs an entry added for these two hostnames -> 127.0.0.1:4432.)
#
# Serves the static portal site from sites/www.buitendyk.ca/, redirects the
# bare domain to the canonical www host, and reverse-proxies the dubber
# control panel's API calls (/dubber/api/) to the youtube-spanish-dubber
# service running locally on 127.0.0.1:8088, plus the whole asset balancer
# app (/balancer/ -> 127.0.0.1:8091, from the `balancer` branch), whose UI
# is served by its own Node service rather than from this static tree.
#
# That proxy path is protected with HTTP Basic Auth (auth_basic + a
# .htpasswd file) -- this is the "site creds" gate referenced by
# sites/www.buitendyk.ca/dubber/dubber.js: until the browser supplies valid
# credentials, requests to /dubber/api/* come back 401 and the page's submit
# button stays disabled ("ghosted"). Once the visitor signs in via the
# browser's native Basic Auth prompt, the credentials are cached for this
# origin and every subsequent request -- including job submission -- carries
# them automatically.
#
# Install with deploy/install.sh, which copies this file into
# /etc/nginx/sites-available/ and symlinks it into sites-enabled/.

# Redirect the bare domain to the canonical https://www.buitendyk.ca
server {
    listen 127.0.0.1:4432 ssl;
    server_name buitendyk.ca;

    ssl_certificate     /etc/letsencrypt/live/www.buitendyk.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.buitendyk.ca/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://www.buitendyk.ca$request_uri;
}

server {
    listen 127.0.0.1:4432 ssl;
    server_name www.buitendyk.ca;

    ssl_certificate     /etc/letsencrypt/live/www.buitendyk.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.buitendyk.ca/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /var/www/www.buitendyk.ca;
    index index.html;

    add_header X-Content-Type-Options nosniff   always;
    add_header X-Frame-Options        SAMEORIGIN always;
    add_header Referrer-Policy        no-referrer always;

    # The dubber page must never be cached: its assets are cache-busted by
    # query-string versions (style.css?v=N, dubber.js?v=N), which only works if
    # the HTML referencing them is always re-fetched -- a stale page kept
    # serving a previous release's JS after a deploy (the transcript card
    # rendered in the wrong place because the browser held old dubber.js).
    # Exact-match (`location =`) is unambiguous: `/dubber/` is served via the
    # `index` directive's internal redirect to `/dubber/index.html`, and both
    # are pinned no-store here. `add_header` in a location replaces the
    # inherited set, so the security trio is repeated. (Neither matches
    # /dubber/api/... or /dubber/dubber.js, so the proxy and the versioned
    # assets are unaffected.)
    location = /dubber/ {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff   always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        no-referrer always;
    }
    location = /dubber/index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff   always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        no-referrer always;
    }

    # Reverse proxy for the dubber control panel's API calls. Gated behind
    # HTTP Basic Auth -- this IS the "sign in" the dubber page's JS checks
    # for via GET /dubber/api/healthz.
    location /dubber/api/ {
        auth_basic           "www.buitendyk.ca";
        auth_basic_user_file /etc/nginx/.htpasswd-www-buitendyk-ca;

        proxy_pass http://127.0.0.1:8088/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Job submission triggers a download + dub + upload pipeline; allow
        # generous timeouts so long-poll-ish requests don't get cut short.
        proxy_read_timeout 120s;
    }

    # Asset balancer (the `balancer` branch): a Node service on 127.0.0.1:8091
    # that serves its own UI and API, so the whole prefix is proxied. Gated
    # behind the same site creds as the dubber's API -- the app's own login
    # (APP_PASSWORD) is left disabled in its env file. The trailing slash on
    # proxy_pass strips the /balancer/ prefix; the app's frontend uses relative
    # URLs, so everything resolves under the prefix. The exact-match redirect
    # makes /balancer land on /balancer/ (relative URLs break without the
    # trailing slash).
    # Absolute URL on purpose: a relative `return 301 /balancer/;` makes nginx
    # build the Location header from this vhost's listen port, leaking the
    # internal SNI-router port (https://www.buitendyk.ca:4432/balancer/).
    location = /balancer {
        return 301 https://$host/balancer/;
    }
    location /balancer/ {
        auth_basic           "www.buitendyk.ca";
        auth_basic_user_file /etc/nginx/.htpasswd-www-buitendyk-ca;

        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The UI is tiny and changes with deploys; don't let browsers cache it.
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff   always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        no-referrer always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/www.buitendyk.ca.access.log;
    error_log  /var/log/nginx/www.buitendyk.ca.error.log;
}
