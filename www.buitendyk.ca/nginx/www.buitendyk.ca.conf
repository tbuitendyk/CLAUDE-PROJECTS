# nginx site config for https://www.buitendyk.ca
#
# Serves the static portal site from sites/www.buitendyk.ca/, redirects the
# bare domain to the canonical www host, and reverse-proxies the dubber
# control panel's API calls (/dubber/api/) to the youtube-spanish-dubber
# service running locally on 127.0.0.1:8088.
#
# That proxy path is protected with HTTP Basic Auth (auth_basic + a
# .htpasswd file) -- this is the "site creds" gate referenced by
# sites/www.buitendyk.ca/dubber/dubber.js: until the browser supplies valid
# credentials, requests to /dubber/api/* come back 401 and the page's submit
# button stays disabled ("ghosted"). Once the visitor signs in via the
# browser's native Basic Auth prompt, the credentials are cached for this
# origin and every subsequent request -- including job submission -- carries
# them automatically.
#
# Install with deploy/install.sh, which copies this file into
# /etc/nginx/sites-available/ and symlinks it into sites-enabled/.
#
# TLS certificates are assumed to be managed the same way as the rest of the
# VPS (e.g. certbot / Let's Encrypt) -- adjust the ssl_certificate paths
# below to match your existing setup.

# Redirect the bare domain to the canonical https://www.buitendyk.ca
server {
    listen 80;
    listen [::]:80;
    server_name buitendyk.ca www.buitendyk.ca;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://www.buitendyk.ca$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name buitendyk.ca;

    ssl_certificate     /etc/letsencrypt/live/www.buitendyk.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.buitendyk.ca/privkey.pem;

    return 301 https://www.buitendyk.ca$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.buitendyk.ca;

    ssl_certificate     /etc/letsencrypt/live/www.buitendyk.ca/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.buitendyk.ca/privkey.pem;

    root /var/www/www.buitendyk.ca;
    index index.html;

    # Reverse proxy for the dubber control panel's API calls. Gated behind
    # HTTP Basic Auth -- this IS the "sign in" the dubber page's JS checks
    # for via GET /dubber/api/healthz.
    location /dubber/api/ {
        auth_basic           "buitendyk.ca";
        auth_basic_user_file /etc/nginx/.htpasswd-www-buitendyk-ca;

        proxy_pass http://127.0.0.1:8088/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Job submission triggers a download + dub + upload pipeline; allow
        # generous timeouts so long-poll-ish requests don't get cut short.
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
