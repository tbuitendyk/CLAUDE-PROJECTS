# nginx reverse proxy for KJV MCP Server — non-standard port variant
# Used when ports 80/443 are already in use by another service.
#
# Place at: /etc/nginx/sites-available/kjv-mcp
# Enable:   ln -s /etc/nginx/sites-available/kjv-mcp /etc/nginx/sites-enabled/kjv-mcp
# Reload:   systemctl reload nginx

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # SSE / MCP streaming — must disable buffering
    proxy_buffering           off;
    proxy_cache               off;
    proxy_read_timeout        300s;
    proxy_send_timeout        300s;
    proxy_connect_timeout     10s;
    chunked_transfer_encoding on;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
